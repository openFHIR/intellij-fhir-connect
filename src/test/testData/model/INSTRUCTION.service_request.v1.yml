grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: INSTRUCTION.service_request.v1
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-INSTRUCTION.service_request.v1
    revision: 1.1.3-alpha
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/ServiceRequest

mappings:
  - name: "healthCareFacility"
    with:
      fhir: "$resource.requester"
      openehr: "$archetype/context/health_care_facility"

  - name: "caseIdentification"
    with:
      fhir: "$resource.encounter.identifier"
      openehr: "$composition/context/other_context[at0001]/items[openEHR-EHR-CLUSTER.case_identification.v0]"
    slotArchetype: "CLUSTER.case_identification.v0"
