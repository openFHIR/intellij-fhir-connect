name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches pluginVersion
        run: |
          VERSION="$(grep -E '^pluginVersion *=' gradle.properties | sed 's/.*= *//')"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pluginVersion=$VERSION in gradle.properties" >&2
            exit 1
          fi

      - name: Build, test and verify
        run: ./gradlew build verifyPlugin --no-daemon

      - name: Extract release notes from CHANGELOG.md
        # Runs before publishPlugin, which patches the Unreleased section into the version heading.
        run: ./gradlew getChangelog --unreleased --no-header --no-daemon --quiet > release-notes.md

      - name: Sign and publish the plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/distributions/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

      - name: Open a pull request with the patched changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="changelog-update-$VERSION"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Changelog already up to date"
            exit 0
          fi
          git commit -m "Changelog update - $VERSION"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Changelog update - $VERSION" \
            --body "Moves the Unreleased section of CHANGELOG.md to $VERSION (created by the release workflow)."
